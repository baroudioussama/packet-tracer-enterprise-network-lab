<svg width="680" height="456" viewBox="0 0 680 456" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Addition to the enterprise network: internet edge with firewall and internal file server</title>
<desc>Diagram showing a new chain: Internet/ISP, a firewall, the existing edge router with a new uplink, leading into the existing HQ network which now also contains a file server on the IT VLAN.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="456" fill="#F8FAFC"/>

<g>
<rect x="220" y="30" width="240" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="340" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Internet / ISP</text>
<text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#475569">RTR-ISP (simulated)</text>
</g>

<g>
<rect x="220" y="116" width="240" height="56" rx="10" fill="#FFF1EE" stroke="#FDA48A" stroke-width="1"/>
<text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Firewall</text>
<text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9A3412">ASA 5505, NAT + ACL</text>
</g>

<g>
<rect x="220" y="202" width="240" height="56" rx="10" fill="#F3F0FF" stroke="#C4B5FD" stroke-width="1"/>
<text x="340" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Edge router</text>
<text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5B21B6">RTR-HQ, new Fa0/3/0 uplink</text>
</g>

<g>
<rect x="140" y="288" width="400" height="128" rx="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="340" y="316" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Existing HQ network</text>
</g>

<g>
<rect x="240" y="344" width="200" height="56" rx="10" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1"/>
<text x="340" y="362" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">SRV-IT</text>
<text x="340" y="380" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0E7490">File server, VLAN 20</text>
</g>

<line x1="340" y1="86" x2="340" y2="116" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="172" x2="340" y2="202" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="258" x2="340" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
